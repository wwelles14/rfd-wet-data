name: Update river data
on:
  schedule:
    - cron: "4,19,34,49 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: data
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Fetch CDEC, USGS normals, daily peaks, travel times
        run: python3 update_data.py
      - name: Commit new data
        run: |
          git config user.name "rfd-wet-data"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "no new data"; exit 0; fi
          git commit -m "data $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase --quiet || true
          git push
